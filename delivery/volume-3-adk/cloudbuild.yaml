options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: mirror.gcr.io/library/python:3.12.11-slim@sha256:47ae396f09c1303b8653019811a8498470603d7ffefc29cb07c88f1f8cb3d19f
    id: deterministic-tests
    entrypoint: bash
    args:
      - -ceu
      - |
        export PYTHONPATH=examples/python/adk-enterprise-workflow/src:examples/python/adk-enterprise-workflow
        python3 -m unittest \
          examples/python/adk-enterprise-workflow/tests/test_models.py \
          examples/python/adk-enterprise-workflow/tests/test_workflow.py \
          examples/python/adk-enterprise-workflow/tests/test_telemetry.py \
          examples/python/adk-enterprise-workflow/tests/test_evaluation.py \
          examples/python/adk-enterprise-workflow/tests/test_deploy.py -v
        python3 examples/python/adk-enterprise-workflow/evaluate_release.py \
          examples/python/adk-enterprise-workflow/evals/release_cases.json \
          --output /workspace/deterministic-eval-report.json
        python3 -m compileall -q examples/python/adk-enterprise-workflow

  - name: mirror.gcr.io/library/python:3.12.11-slim@sha256:47ae396f09c1303b8653019811a8498470603d7ffefc29cb07c88f1f8cb3d19f
    id: pinned-adk-graph-test
    entrypoint: bash
    args:
      - -ceu
      - |
        python3 -m pip install --no-cache-dir 'google-adk==2.6.1'
        export PYTHONPATH=examples/python/adk-enterprise-workflow/src
        python3 -m unittest examples/python/adk-enterprise-workflow/tests/test_adk_graph.py -v

artifacts:
  objects:
    location: gs://${_EVIDENCE_BUCKET}/volume-3/${BUILD_ID}/
    paths:
      - deterministic-eval-report.json

substitutions:
  _EVIDENCE_BUCKET: SET_IN_TRIGGER
